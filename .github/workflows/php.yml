name: Compatibility

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['^12.0', '^13.0']
        experimental: [false]
        exclude:
          - php: '8.2'
            laravel: '^13.0'
        include:
          # Laravel's published support table currently ends at PHP 8.5.
          - php: '8.6'
            laravel: '^12.0'
            experimental: true
          - php: '8.6'
            laravel: '^13.0'
            experimental: true
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer require "laravel/framework:${{ matrix.laravel }}" --no-update --no-interaction
      - run: composer update --prefer-dist --no-progress --no-interaction --no-plugins
      - run: composer test
      - run: composer audit
